name: Build and publish Docker image

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Determine image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check scripts and container startup
        env:
          IMAGE: ${{ steps.image.outputs.name }}:latest
        run: |
          set -eu
          docker run --rm --entrypoint sh "$IMAGE" -n /app/entrypoint.sh
          docker run --rm --entrypoint python3 "$IMAGE" -m py_compile /app/sync.py
          docker run --rm --entrypoint megatools "$IMAGE" dl --help
          docker run -d --name megasync-smoke -e RUN_ON_STARTUP=false "$IMAGE"
          trap 'docker logs megasync-smoke; docker rm -fv megasync-smoke' EXIT
          sleep 5
          test "$(docker inspect --format '{{.State.Running}}' megasync-smoke)" = true
          docker exec megasync-smoke test -f /config/Link.txt
          docker logs megasync-smoke 2>&1 | grep -F 'Nächster Prüflauf'
          docker stop --time 10 megasync-smoke
          test "$(docker inspect --format '{{.State.ExitCode}}' megasync-smoke)" = 0

      - name: Publish tested image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          docker push "$IMAGE:sha-${{ github.sha }}"
          docker push "$IMAGE:latest"
